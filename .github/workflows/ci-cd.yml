name: Sakwa CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. CI: Code Validation & Quality Check
  code-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Core Project Structure
        run: |
          echo "Running Automated CI Checks for Sakwa Canneries..."
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f css/style.css || { echo "css/style.css missing"; exit 1; }
          test -f js/app.js || { echo "js/app.js missing"; exit 1; }
          test -f js/mockData.js || { echo "js/mockData.js missing"; exit 1; }
          echo "✅ All core web assets verified successfully!"

  # 2. CD: Automatic Deployment to GitHub Pages
  deploy-live-website:
    needs: code-quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
